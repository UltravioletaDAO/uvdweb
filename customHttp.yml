# Amplify custom HTTP headers (replaces the deprecated customHeaders block in amplify.yml).
# Docs: https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
# NOTE: no includeSubDomains on HSTS (402milly./402millones. are HTTP-only) and no
# /*.md Content-Type until the SPA rewrite rule excludes .md (needs Amplify customRules change).
customHeaders:
  - pattern: '/**'
    headers:
      - key: 'Link'
        value: '</.well-known/api-catalog>; rel="api-catalog", </.well-known/mcp/server-card.json>; rel="mcp-server-card", </.well-known/agent-skills/index.json>; rel="agent-skills", </.well-known/oauth-protected-resource>; rel="oauth-protected-resource", </agents>; rel="service-doc"'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
  - pattern: '/.well-known/api-catalog'
    headers:
      - key: 'Content-Type'
        value: 'application/linkset+json'
  - pattern: '/.well-known/**'
    headers:
      - key: 'Access-Control-Allow-Origin'
        value: '*'
      - key: 'Access-Control-Allow-Methods'
        value: 'GET, HEAD, OPTIONS'
  - pattern: '/static/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
